name: bench

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y liburing-dev fio
      - name: build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 4
      - name: bench
        run: |
          sudo mkdir -p /mnt/bench && sudo chown "$USER" /mnt/bench
          ./scripts/bench_linux.sh build /mnt/bench 2>&1 | tee bench-linux.txt
      - uses: actions/upload-artifact@v5
        with:
          name: bench-linux
          path: bench-linux.txt
